<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal POS - First Time Setup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }

    .setup-container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #667eea;
    }

    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.5s ease;
    }

    .status {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .setup-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .setup-btn:hover {
      transform: translateY(-2px);
    }

    .setup-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="logo">💎</div>
    <h1>Welcome to Crystal POS</h1>
    <p id="description">Let's set up your Point of Sale system. This will only take a moment.</p>
    
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    
    <div class="status" id="status">Ready to begin</div>
    <div class="spinner" id="spinner"></div>
    
    <button class="setup-btn" id="setupBtn" onclick="startSetup()">
      Start Setup
    </button>
  </div>

  <script>
    const setupBtn = document.getElementById('setupBtn');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const spinner = document.getElementById('spinner');
    const description = document.getElementById('description');

    async function startSetup() {
      setupBtn.disabled = true;
      spinner.classList.add('active');
      
      const steps = [
        { text: 'Initializing database...', progress: 25 },
        { text: 'Setting up configuration...', progress: 50 },
        { text: 'Preparing workspace...', progress: 75 },
        { text: 'Finalizing setup...', progress: 100 }
      ];

      for (let i = 0; i < steps.length; i++) {
        status.textContent = steps[i].text;
        progress.style.width = steps[i].progress + '%';
        await new Promise(resolve => setTimeout(resolve, 800));
      }

      // Trigger actual setup
      const result = await window.electronAPI.startSetup();
      
      if (result.success) {
        status.textContent = 'Setup complete! Starting application...';
        description.textContent = 'Your Crystal POS is ready to use.';
        
        setTimeout(() => {
          window.electronAPI.completeSetup();
        }, 1000);
      } else {
        status.textContent = 'Setup failed: ' + result.error;
        spinner.classList.remove('active');
        setupBtn.disabled = false;
        setupBtn.textContent = 'Retry Setup';
      }
    }
  </script>
</body>
</html>
